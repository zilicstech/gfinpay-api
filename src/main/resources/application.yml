spring:
  application:
    name: fintech-svc
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    access-token-minutes: ${APP_AUTH_ACCESS_TOKEN_MINUTES:30}
    idle-minutes: ${APP_AUTH_IDLE_MINUTES:30}
    session-absolute-hours: ${APP_AUTH_SESSION_ABSOLUTE_HOURS:12}
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:gfp_rt}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
      # Must be true anywhere the app is served over HTTPS.
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      path: ${APP_AUTH_COOKIE_PATH:/api/v1/auth}
  webhook:
    secret: ${APP_WEBHOOK_SECRET}
  self-base-url: ${APP_SELF_BASE_URL}
  otp:
    demo: false
  sms:
    provider: ${APP_SMS_PROVIDER:mock}
    r2win:
      base-url: ${APP_SMS_R2WIN_BASE_URL:https://smsapi.r2win.com}
      access-key: ${APP_SMS_R2WIN_ACCESS_KEY:}
      header: ${APP_SMS_R2WIN_HEADER:GFINPY}
      otp-template-id: ${APP_SMS_R2WIN_OTP_TEMPLATE_ID:1077291870062568175}
      otp-template-text: ${APP_SMS_R2WIN_OTP_TEMPLATE_TEXT:Dear User, <VAR1> is your One-Time Password (OTP) to access your account. Valid for <VAR2> mins. Do not share it with anyone. Team GFinPay}
  surepass:
    mode: ${APP_SUREPASS_MODE:live}
    base-url: ${APP_SUREPASS_BASE_URL:https://kyc-api.surepass.app}
    api-token: ${APP_SUREPASS_TOKEN:}
    digilocker:
      gateway: ${APP_SUREPASS_DIGILOCKER_GATEWAY:production}
      signup-flow: ${APP_SUREPASS_DIGILOCKER_SIGNUP_FLOW:true}
      verify-phone: ${APP_SUREPASS_DIGILOCKER_VERIFY_PHONE:false}
      skip-main-screen: ${APP_SUREPASS_DIGILOCKER_SKIP_MAIN_SCREEN:false}
      expiry-minutes: ${APP_SUREPASS_DIGILOCKER_EXPIRY_MINUTES:10}
      webhook-url: ${APP_SUREPASS_DIGILOCKER_WEBHOOK_URL:}
  agreement:
    enforce: ${APP_AGREEMENT_ENFORCE:true}
    default-onboarding-fee: ${APP_AGREEMENT_DEFAULT_ONBOARDING_FEE:0}
  esign:
    mode: ${APP_ESIGN_MODE:${APP_SUREPASS_MODE:live}}
    base-url: ${APP_ESIGN_BASE_URL:${APP_SUREPASS_BASE_URL:https://kyc-api.surepass.app}}
    api-token: ${APP_ESIGN_TOKEN:${APP_SUREPASS_TOKEN:}}
    redirect-url: ${APP_ESIGN_REDIRECT_URL:${APP_PUBLIC_APP_URL:http://localhost:3001}/esign/return}
    sign-all-pages: ${APP_ESIGN_SIGN_ALL_PAGES:true}
    name-match-score: ${APP_ESIGN_NAME_MATCH_SCORE:70}
    status-check-throttle-seconds: ${APP_ESIGN_STATUS_CHECK_THROTTLE_SECONDS:20}
    session-ttl-hours: ${APP_ESIGN_SESSION_TTL_HOURS:24}
  pii:
    key: ${APP_PII_KEY:dev-pii-key-32-bytes-minimum-key!}
  onboarding:
    otp-secret: ${APP_OTP_SECRET:dev-otp-hmac-secret-key-for-local}
    invite-ttl-days: ${APP_ONBOARDING_INVITE_TTL_DAYS:7}
    session-ttl-minutes: ${APP_ONBOARDING_SESSION_TTL_MINUTES:60}
  bootstrap:
    admin:
      code: ${BOOTSTRAP_ADMIN_CODE}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      mobile: ${BOOTSTRAP_ADMIN_MOBILE:0000000000}
      full-name: Platform Admin
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@gfinpay.com}
  cors:
    allow-all-origins: ${APP_CORS_ALLOW_ALL_ORIGINS:false}
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  public-app-url: ${APP_PUBLIC_APP_URL}
  kbill:
    base-url: ${APP_KBILL_BASE_URL:}
    api-token: ${APP_KBILL_API_TOKEN:}
  emerald:
    base-url: ${APP_EMERALD_BASE_URL:https://myemerald.in}
    client-id: ${APP_EMERALD_CLIENT_ID:}
    client-secret: ${APP_EMERALD_CLIENT_SECRET:}
    entity-code: ${APP_EMERALD_ENTITY_CODE:ENT000002}
    default-pipe: ${APP_EMERALD_DEFAULT_PIPE:INSTANTPAY}
    callback-secret: ${APP_EMERALD_CALLBACK_SECRET:}
    aeps-transact-path: ${APP_EMERALD_AEPS_TRANSACT_PATH:}
    payout-status-path: ${APP_EMERALD_PAYOUT_STATUS_PATH:}
    log-payloads: ${APP_EMERALD_LOG_PAYLOADS:true}
    mask-account-numbers: ${APP_EMERALD_MASK_ACCOUNT_NUMBERS:true}
  biometric:
    rd-env: ${APP_BIOMETRIC_RD_ENV:P}
    allow-pasted-pid: ${APP_BIOMETRIC_ALLOW_PASTED_PID:false}
  payout:
    min-cashout-txns: ${APP_PAYOUT_MIN_CASHOUT_TXNS:7}
    cashout-recency-days: ${APP_PAYOUT_CASHOUT_RECENCY_DAYS:7}
  spaces:
    endpoint: ${APP_SPACES_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${APP_SPACES_REGION:sgp1}
    bucket: ${APP_SPACES_BUCKET:gfinpay}
    prefix: ${APP_SPACES_PREFIX:dev}
    access-key: ${APP_SPACES_ACCESS_KEY:}
    secret-key: ${APP_SPACES_SECRET_KEY:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-system}] %logger{24} - %msg%n"
