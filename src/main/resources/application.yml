spring:
  application:
    name: fintech-svc
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    access-token-minutes: ${APP_AUTH_ACCESS_TOKEN_MINUTES:30}
    idle-minutes: ${APP_AUTH_IDLE_MINUTES:30}
    session-absolute-hours: ${APP_AUTH_SESSION_ABSOLUTE_HOURS:12}
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:gfp_rt}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
      # Must be true anywhere the app is served over HTTPS.
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      path: ${APP_AUTH_COOKIE_PATH:/api/v1/auth}
  webhook:
    secret: ${APP_WEBHOOK_SECRET}
  self-base-url: ${APP_SELF_BASE_URL}
  otp:
    demo: false
  bootstrap:
    admin:
      code: ${BOOTSTRAP_ADMIN_CODE}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      mobile: ${BOOTSTRAP_ADMIN_MOBILE:0000000000}
      full-name: Platform Admin
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@gfinpay.com}
  cors:
    allow-all-origins: ${APP_CORS_ALLOW_ALL_ORIGINS:false}
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  public-app-url: ${APP_PUBLIC_APP_URL}
  paysprint:
    base-url: ${APP_PAYSPRINT_BASE_URL}
    partner-id: ${APP_PAYSPRINT_PARTNER_ID}
    merchant-code: ${PAYSPRINT_MERCHANT_CODE}
    jwt-key: ${PAYSPRINT_JWT_KEY}
    authorised-key: ${PAYSPRINT_AUTHORISED_KEY}
    aes-key: ${PAYSPRINT_AES_KEY}
    aes-iv: ${PAYSPRINT_AES_IV}
    jwt-product: FIXED_DEPOSIT
    fd-card-type: ${PAYSPRINT_FD_CARD_TYPE:1}
    callback-enabled: true
    callback-secret: ${PAYSPRINT_CALLBACK_SECRET}
  kbill:
    base-url: ${APP_KBILL_BASE_URL:}
    api-token: ${APP_KBILL_API_TOKEN:}
  spaces:
    endpoint: ${APP_SPACES_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${APP_SPACES_REGION:sgp1}
    bucket: ${APP_SPACES_BUCKET:gfinpay}
    prefix: ${APP_SPACES_PREFIX:dev}
    access-key: ${APP_SPACES_ACCESS_KEY:}
    secret-key: ${APP_SPACES_SECRET_KEY:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-system}] %logger{24} - %msg%n"
