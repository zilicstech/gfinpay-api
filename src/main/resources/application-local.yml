server:
  port: 8090

# Local profile wins over APP_* in .env so minted /v and /a links use the dev UI, not production.
app:
  self-base-url: http://localhost:8090
  public-app-url: http://localhost:3001
  cors:
    # Must stay false: the refresh cookie needs credentialed CORS, which cannot be paired
    # with wildcard origins. The dev UI origin is listed explicitly below.
    allow-all-origins: false
    allowed-origins: http://localhost:3001,http://192.168.68.105:3001
  paysprint:
    rd-env: P
    allow-pasted-pid: true

logging:
  level:
    com.fintech: INFO
